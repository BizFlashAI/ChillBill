[project]
name = "chillbill-backend"
version = "0.1.0"
description = "ChillBill personal finance API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "pydantic==2.10.3",
    "python-dotenv==1.0.1",
    "firebase-admin==6.6.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
